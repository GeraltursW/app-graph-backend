spring:
  application:
    name: app-graph-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/app_relation}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app-graph:
  storage-root: ${STORAGE_ROOT:./storage}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  function-match:
    ai-url: ${FUNCTION_MATCH_AI_URL:}
    ai-key: ${FUNCTION_MATCH_AI_KEY:}
    timeout-seconds: ${FUNCTION_MATCH_AI_TIMEOUT_SECONDS:60}
